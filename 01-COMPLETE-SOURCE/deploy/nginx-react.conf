server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Copy deploy/snippets/cyberaware-security-headers.conf to
    # /etc/nginx/snippets/ before enabling this server block.
    include /etc/nginx/snippets/cyberaware-security-headers.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
    }

    location ^~ /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
    }

    location ^~ /videos/ {
        try_files $uri =404;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
    }

    location = /legacy.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
