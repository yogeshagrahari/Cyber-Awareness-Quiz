# CYBERAWARE 3D — dependency-free static demonstrator deployment.
# Serve the contents of frontend/dist from /usr/share/nginx/html.
# Put this listener behind a TLS-terminating ingress/load balancer; do not
# expose plain HTTP publicly. Configure HTTPS and HSTS at that trusted edge.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    client_max_body_size 1k;

    # The static application has no write endpoints.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
        return 200 "ok\n";
    }

    # The application server maps these public asset namespaces to public/.
    # Keep the same URL contract for Nginx static hosting.
    location ^~ /data/ {
        root /usr/share/nginx/html/public;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
    }

    location ^~ /videos/ {
        root /usr/share/nginx/html/public;
        try_files $uri =404;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
    }

    location ^~ /models/ {
        root /usr/share/nginx/html/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
    }

    location ^~ /textures/ {
        root /usr/share/nginx/html/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
    }

    # Do not expose the internal public/ tree or duplicate legacy source tree.
    location ^~ /public/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/cyberaware-security-headers.conf;
    }
}
